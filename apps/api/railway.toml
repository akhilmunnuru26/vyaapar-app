# LEGACY Config-as-Code (deprecated for new Railway services). Use .railway/railway.ts instead.
# Point Railway to this file (absolute path): /apps/api/railway.toml
# Repo root directory for the service should stay at / (monorepo root).

[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @retail-management/api build"
watchPatterns = ["apps/api/**", "packages/**"]

[deploy]
startCommand = "pnpm --filter @retail-management/api start"
preDeployCommand = "pnpm db:migrate"
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
